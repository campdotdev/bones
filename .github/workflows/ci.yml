name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ── Bones library ──────────────────────────────────────────
  bones-check:
    name: "Bones: Lint, Format & Types"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Run lint, format, and type checks
        run: vp run --filter @camp.dev/bones check

  bones-build:
    name: "Bones: Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Build library
        run: vp run --filter @camp.dev/bones build

  bones-test:
    name: "Bones: Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Run tests
        run: vp run --filter @camp.dev/bones test -- --run --project unit

  bones-visual:
    name: "Bones: Visual Regression"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Install Playwright Chromium
        working-directory: packages/bones
        run: vp exec playwright install --with-deps chromium

      - name: Run browser tests
        run: vp run --filter @camp.dev/bones test -- --run --project browser

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bones-visual-output
          path: |
            packages/bones/tests/browser/__screenshots__/
            packages/bones/.vitest-attachments/

  # ── Demo app ───────────────────────────────────────────────
  demo-check:
    name: "Demo: Lint & Types"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Build bones library
        run: vp run --filter @camp.dev/bones build

      - name: Run type check
        run: vp run --filter bones-demo check

  demo-build:
    name: "Demo: Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Build bones library
        run: vp run --filter @camp.dev/bones build

      - name: Build demo app
        run: vp run --filter bones-demo build

  demo-test:
    name: "Demo: Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Build bones library
        run: vp run --filter @camp.dev/bones build

      - name: Run tests
        run: vp run --filter bones-demo test -- --run

  # ── Streaming demo ─────────────────────────────────────────
  stream-check:
    name: "Stream: Types"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Build bones library
        run: vp run --filter @camp.dev/bones build

      - name: Run type check
        run: vp run --filter bones-stream check

  stream-test:
    name: "Stream: Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Build bones library
        run: vp run --filter @camp.dev/bones build

      - name: Run tests
        run: vp run --filter bones-stream test -- --run

  # ── Docs site ──────────────────────────────────────────────
  docs-check:
    name: "Docs: Types"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Build bones library
        run: vp run --filter @camp.dev/bones build

      - name: Run type check
        run: vp run --filter bones-docs check

  docs-build:
    name: "Docs: Build"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Build bones library
        run: vp run --filter @camp.dev/bones build

      - name: Build docs site
        run: vp run --filter bones-docs build
