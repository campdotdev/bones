<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bones-boundary sandbox</title>
    <link rel="stylesheet" href="../src/css/auto.css" />
    <style>
      /* bones.css picks --bone-base from prefers-color-scheme, so the page must
         follow the scheme too or dark-mode bones paint white on white. */
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      img {
        display: block;
      }
      fieldset {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 1rem;
      }
      pre {
        background: light-dark(#f4f4f4, #1f1f1f);
        padding: 0.5rem;
        max-height: 10rem;
        overflow: auto;
      }
    </style>
    <!-- Run `vp pack` first, then serve this folder over http (module scripts
         do not load from file://): `python3 -m http.server` in packages/bones,
         then open http://localhost:8000/sandbox/boundary.html -->
    <script type="module" src="../dist/element/index.mjs"></script>
  </head>
  <body>
    <fieldset data-bones-auto="off">
      <button id="toggle-busy">Toggle busy</button>
      <button id="toggle-force">Toggle force</button>
      <label>delay <input id="delay" type="number" value="200" min="0" step="50" /></label>
      <label
        >min-duration <input id="min-duration" type="number" value="400" min="0" step="50"
      /></label>
      <label><input id="transition" type="checkbox" checked /> view transition</label>
    </fieldset>

    <bones-boundary id="boundary">
      <h1>Article title</h1>
      <p>First paragraph with a couple of lines of copy to show the bar geometry.</p>
      <p>Second paragraph, shorter.</p>
      <img src="https://placehold.co/120" alt="avatar" width="120" height="120" />
      <button>Save</button>
    </bones-boundary>

    <pre id="log"></pre>

    <script type="module">
      const boundary = document.getElementById("boundary");
      const log = document.getElementById("log");
      const stamp = () => new Date().toISOString().slice(11, 23);
      for (const type of ["bones:show", "bones:hide"]) {
        boundary.addEventListener(type, () => {
          log.textContent += `${stamp()} ${type}\n`;
        });
      }
      document.getElementById("toggle-busy").addEventListener("click", () => {
        boundary.busy = !boundary.busy;
        log.textContent += `${stamp()} busy=${boundary.busy}\n`;
      });
      document.getElementById("toggle-force").addEventListener("click", () => {
        boundary.force = !boundary.force;
        log.textContent += `${stamp()} force=${boundary.force}\n`;
      });
      document.getElementById("delay").addEventListener("change", (event) => {
        boundary.delay = Number(event.target.value);
      });
      document.getElementById("min-duration").addEventListener("change", (event) => {
        boundary.minDuration = Number(event.target.value);
      });
      document.getElementById("transition").addEventListener("change", (event) => {
        boundary.transition = event.target.checked ? "auto" : "none";
      });
    </script>
  </body>
</html>
